<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A1E15" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title data-seo-estatico>Carlos Oliveira | Escultor entalhador</title>
    <meta
      data-seo-estatico
      name="description"
      content="Escultura e entalhe em madeira maciça, à mão: arte sacra, fauna, figuras, relógios e molduras. Mais de 300 peças prontas e encomendas sob medida."
    />

    <!--
      Open Graph ESTÁTICO.
      Os robôs de preview do WhatsApp, Facebook e Instagram não executam
      JavaScript, então leem apenas o que está aqui — as tags por rota do
      componente <Seo> não chegam neles. Ao trocar de domínio, atualize as
      URLs absolutas abaixo E a constante SITE_URL em src/lib/brand.ts.
    -->
    <meta data-seo-estatico property="og:type" content="website" />
    <meta data-seo-estatico property="og:site_name" content="Carlos Oliveira, escultor entalhador" />
    <meta data-seo-estatico property="og:locale" content="pt_BR" />
    <meta data-seo-estatico property="og:title" content="Carlos Oliveira | Escultor entalhador" />
    <meta
      data-seo-estatico
      property="og:description"
      content="Mais de 300 peças entalhadas à mão em madeira maciça. Sem molde, sem resina, sem emenda."
    />
    <meta data-seo-estatico property="og:url" content="https://carlos-oliveira-entalhes.vercel.app/" />
    <meta
      data-seo-estatico
      property="og:image"
      content="https://carlos-oliveira-entalhes.vercel.app/og-image.jpg"
    />
    <meta data-seo-estatico property="og:image:width" content="1200" />
    <meta data-seo-estatico property="og:image:height" content="630" />
    <meta
      data-seo-estatico
      property="og:image:alt"
      content="Busto de Cristo entalhado em madeira por Carlos Oliveira"
    />

    <meta data-seo-estatico name="twitter:card" content="summary_large_image" />
    <meta data-seo-estatico name="twitter:title" content="Carlos Oliveira | Escultor entalhador" />
    <meta
      data-seo-estatico
      name="twitter:description"
      content="Mais de 300 peças entalhadas à mão em madeira maciça. Sem molde, sem resina, sem emenda."
    />
    <meta
      data-seo-estatico
      name="twitter:image"
      content="https://carlos-oliveira-entalhes.vercel.app/og-image.jpg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
